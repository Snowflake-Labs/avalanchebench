services:
  main:
    build:
      context: ${CONTEXT_DIR}
    image: ${MAIN_IMAGE_NAME}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        PYTHONPATH=/opt/avbench python -m avalanche_bench.materialize_runtime customer-support
        && touch /tmp/entrypoint_ready && sleep infinity
    network_mode: ${NETWORK_MODE:-bridge}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/entrypoint_ready"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 5s
    environment:
      - AVBENCH_DEPLOYMENT_MANIFEST_B64=${AVBENCH_DEPLOYMENT_MANIFEST_B64}
      - SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ACCOUNT:-}
      - SNOWFLAKE_USER=${SNOWFLAKE_USER:-}
      - SNOWFLAKE_PAT=${SNOWFLAKE_PAT:-}
      - SNOWFLAKE_ROLE=${SNOWFLAKE_ROLE:-}
      - SNOWFLAKE_WAREHOUSE=${SNOWFLAKE_WAREHOUSE:-}
