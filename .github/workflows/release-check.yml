name: Release check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          fetch-depth: 0
      - name: Install pinned tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          python -m pip install uv==0.12.5
          uv tool install harbor==0.22.0
          uv sync --locked
      - name: Verify LFS and release artifacts
        run: |
          git lfs fsck
          test "$(git lfs ls-files | wc -l)" -eq 3
          uv run scripts/release_check.py --full
          sed '/^\[\[tasks\]\]/,$d' dataset.toml > /tmp/dataset.toml
          harbor add tasks/ecommerce tasks/customer-support tasks/travel --to /tmp/dataset.toml
          cmp dataset.toml /tmp/dataset.toml
      - name: Scan full Git history
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact=100 .
      - name: Build and inspect task images
        run: |
          expected_runtime="/opt/avbench/avalanche_bench/__init__.py
          /opt/avbench/avalanche_bench/manifests.py
          /opt/avbench/avalanche_bench/materialize_runtime.py
          /opt/avbench/requirements.lock"
          for task in ecommerce customer-support travel; do
            image="avalanche-bench-release-$task"
            docker build --no-cache --tag "$image" "tasks/$task/environment"
            test -z "$(docker run --rm --entrypoint find "$image" /app -mindepth 1 -print)"
            actual_runtime="$(docker run --rm --entrypoint sh "$image" -c 'find /opt/avbench -type f -print | sort')"
            test "$actual_runtime" = "$expected_runtime"
            docker history --no-trunc --format '{{.CreatedBy}}' "$image" | sed -n '1,3p'
          done
