name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          fetch-depth: 0
      - name: Install uv
        run: python -m pip install uv==0.12.5
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint and test
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest
      - name: Verify synchronized runtimes and release structure
        run: |
          uv run scripts/sync_task_runtime.py --check
          git add data/*.zip
          uv run scripts/release_check.py
          sed '/^\[\[tasks\]\]/,$d' dataset.toml > /tmp/dataset.toml
          uvx --from harbor==0.22.0 harbor add tasks/ecommerce tasks/customer-support tasks/travel --to /tmp/dataset.toml
          cmp dataset.toml /tmp/dataset.toml
      - name: Dependency audit
        run: |
          uv export --frozen --no-emit-project --format requirements-txt --no-hashes --no-annotate --no-header --output-file /tmp/avbench-requirements.txt
          uvx --from pip-audit==2.9.0 pip-audit --no-deps --disable-pip -r /tmp/avbench-requirements.txt
      - name: Secret scan
        run: |  # pragma: allowlist secret
          findings="$(uvx --from detect-secrets==1.5.0 detect-secrets scan --exclude-files '(^data/|^uv\.lock$|^tasks/.*/tests/(rubric\.csv|release\.json)$|^src/avalanche_bench/resources/arena_snapshot\.json$|^LICENSE$)' | uv run python -c 'import json,sys; print(sum(map(len,json.load(sys.stdin)["results"].values())))')"
          test "$findings" -eq 0
